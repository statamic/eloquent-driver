name: Run Tests

on: # zizmor: ignore[concurrency-limits]
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions: {}

jobs:
  php-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.3, 8.4, 8.5, 8.6]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - php: 8.6
            laravel: 12.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Require Laravel's PHP 8.6 branch
        shell: bash
        if: matrix.php == '8.6'
        run: composer require "laravel/framework:dev-13/php86-experiment as 13.40.0" --no-interaction --no-update

      - name: Install dependencies
        shell: bash
        env:
          LARAVEL: ${{ matrix.laravel }}
          STABILITY: ${{ matrix.stability }}
        run: |
          composer require "illuminate/contracts:$LARAVEL" --no-interaction --no-update
          composer update --$STABILITY --prefer-dist --no-interaction --no-suggest

      - name: Execute tests
        run: vendor/bin/phpunit
